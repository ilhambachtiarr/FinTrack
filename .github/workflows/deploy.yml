name: 🚀 Deploy to InfinityFree

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        server-dir: /htdocs/
        # Hanya upload file yang berubah, JANGAN hapus file lain di server
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          **/tests/**
          **/*.md
          **/*.sql
          **/database/**
          # Jangan sentuh folder uploads (foto profil, struk, dsb)
          **/uploads/**
          # Jangan timpa config sensitif production
          **/application/config/email.php
          **/application/config/ocr.php
          **/application/logs/**
          **/application/cache/**
