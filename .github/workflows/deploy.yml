name: 🚀 Deploy to InfinityFree

on:
  push:
    branches:
      - main
      - master # Triggers on push to main or master branch

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Full absolute path sesuai Home Directory InfinityFree
        server-dir: /htdocs/
        # Pakai port FTP standar
        port: 21
        # Exclude file yang tidak perlu di server
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          **/tests/**
          **/*.md
          **/*.sql
          **/database/**
